<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mirror · 记录正在发生的我</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Cloudflare Turnstile 人机验证（防机器人刷 AI），explicit 模式由我们手动渲染 -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstile&render=explicit" async defer></script>
<style>
:root{
  --cream:#F2FAF7;
  --ink:#3D5261;
  --ink-soft:#8CA6B4;
  --blue:#3FB8E8;
  --green:#3ECE9F;
  --yellow:#FFD24B;
  --sky:#7FD8F5;
  --mint:#5FD3B3;
  --line:#E0F0E8;
  --shadow:0 10px 30px rgba(97,160,140,.12), 0 2px 8px rgba(61,82,97,.05);
  --radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--cream);
  background-image:radial-gradient(#DCF3FA 1.2px, transparent 1.2px);
  background-size:24px 24px;
  overflow:hidden;
}
/* 背景空气感光斑 */
body::before, body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(90px);
  z-index:0;pointer-events:none;
}
body::before{width:540px;height:540px;top:-130px;left:-90px;
  background:radial-gradient(circle,rgba(168,222,247,.75),transparent 70%)}
body::after{width:580px;height:580px;bottom:-150px;right:-110px;
  background:radial-gradient(circle,rgba(178,240,214,.7),transparent 70%)}
body.locked{overflow:hidden}
button{font-family:inherit}
img{display:block}

/* ================= 站长专属控件（访客隐藏） ================= */
.admin-only{display:none !important}
body.is-admin button.admin-only, body.is-admin i.admin-only, body.is-admin em.admin-only, body.is-admin span.admin-only{display:inline-flex !important}
body.is-admin section.admin-only, body.is-admin div.admin-only{display:block !important}
body.is-admin #contact-add{display:block !important}

/* ================= 开场动画 ================= */
#intro{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#DCF2FF 0%,#DFF8EA 55%,#FFF6D8 100%);
  transition:opacity .75s ease, visibility .75s;
}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.intro-word{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-46%) scale(.94);
  opacity:0;filter:blur(16px);
  transition:opacity .85s cubic-bezier(.22,1,.36,1), transform .85s cubic-bezier(.22,1,.36,1), filter .85s;
  white-space:nowrap;font-weight:800;
}
.intro-word.show{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}
.intro-word.hide{opacity:0;filter:blur(12px);transform:translate(-50%,-72%) scale(.97)}
#w1{
  font-size:clamp(60px,11vw,128px);letter-spacing:.1em;
  background:linear-gradient(95deg,var(--blue),var(--green) 45%,var(--sky));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
#w2{font-size:clamp(20px,3.4vw,38px);letter-spacing:.42em;color:var(--ink);text-indent:.42em}
.intro-skip{
  position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
  font-size:13px;color:var(--ink-soft);letter-spacing:.25em;animation:blink 2s infinite;
}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}
.spark{position:absolute;font-size:22px;opacity:.8;animation:floaty 5s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(8deg)}}

/* ================= 整体布局 ================= */
#app{
  height:100vh;display:grid;grid-template-columns:250px 1fr;
  opacity:0;transform:translateY(14px);
  transition:opacity .8s ease .1s, transform .8s ease .1s;
  position:relative;z-index:2;
}
#app.ready{opacity:1;transform:none}

/* ---------- 侧边栏 ---------- */
#sidebar{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-right:1px solid rgba(255,255,255,.8);
  display:flex;flex-direction:column;padding:28px 16px;gap:8px;
}
.logo{font-size:30px;font-weight:700;display:flex;align-items:center;gap:10px;padding:4px 10px 22px;letter-spacing:.04em}
.logo .logo-emoji{display:inline-block;font-size:28px}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.nav-btn{
  display:flex;align-items:center;gap:12px;padding:13px 16px;
  border:none;background:transparent;border-radius:16px;
  font-size:16px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;transition:all .25s;text-align:left;letter-spacing:.03em;
}
.nav-btn:hover{background:rgba(255,255,255,.65);color:var(--ink);transform:translateX(4px)}
.nav-btn.active{
  background:linear-gradient(120deg,var(--blue),var(--green));
  color:#fff;box-shadow:0 8px 20px rgba(63,184,232,.35);
}
.nav-emoji{font-size:20px}
.sidebar-foot{margin-top:auto;text-align:center;display:flex;flex-direction:column;gap:10px}
/* 访客资料卡（侧边栏底部） */
#visitor-card{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);
  cursor:pointer;transition:.2s;
}
#visitor-card:hover{box-shadow:0 6px 16px rgba(97,160,140,.18);transform:translateY(-1px)}
.vc-avatar{
  width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--green));
}
.vc-avatar img{width:100%;height:100%;object-fit:cover}
.vc-name{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;text-align:left}
.sidebar-foot .foot-text{font-size:12px;color:var(--ink-soft);line-height:1.8}
.replay-btn{
  margin:0 auto;border:1px solid var(--line);background:rgba(255,255,255,.4);border-radius:999px;
  padding:7px 16px;font-size:12px;color:var(--ink-soft);cursor:pointer;transition:.2s;
}
.replay-btn:hover{border-color:var(--blue);color:var(--blue)}

/* ---------- 主区域 ---------- */
#main{overflow-y:auto;padding:34px 42px 90px;position:relative;scroll-behavior:smooth}
#main::-webkit-scrollbar{width:10px}
#main::-webkit-scrollbar-thumb{background:rgba(181,228,210,.65);border-radius:8px;border:3px solid var(--cream)}
.module{display:none;max-width:720px;margin:0 auto}
.module.active{display:block;animation:pop .5s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
.card{
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-radius:var(--radius);box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.75);
}

/* 背景漂浮小图案 */
.bg-emoji{position:fixed;font-size:26px;opacity:.16;animation:floaty 6s ease-in-out infinite;pointer-events:none;z-index:1}

/* ================= About Me ================= */
.about-hero{position:relative;padding:46px 36px 38px;margin-bottom:8px;overflow:hidden;text-align:center}
.blob{position:absolute;border-radius:50%;opacity:.55;z-index:0}
.b1{width:160px;height:160px;background:#CFEFFA;top:-46px;left:-36px}
.b2{width:130px;height:130px;background:#D3F5E4;bottom:-38px;right:6%}
.b3{width:96px;height:96px;background:#FFF3C4;bottom:8px;left:10%}
.about-hero>*:not(.blob){position:relative;z-index:1}
.about-avatar{
  position:relative;width:104px;height:104px;margin:0 auto 16px;border-radius:36px;
  background:linear-gradient(135deg,var(--blue),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:54px;
  border:4px solid rgba(255,255,255,.9);box-shadow:var(--shadow);
  transition:transform .3s;
}
.about-avatar:hover{transform:scale(1.04)}
.about-name{font-size:30px;font-weight:700;letter-spacing:.02em}
.hl{background:linear-gradient(120deg,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.about-slogan{margin-top:10px;color:var(--ink-soft);letter-spacing:.35em;font-size:14px;text-indent:.35em}
.tag-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.tag{position:relative;display:inline-flex;align-items:center;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;transition:.2s;border:2px solid transparent;cursor:default}
.tag:hover{transform:translateY(-3px)}
.tag-blue{background:rgba(228,243,253,.68);border-color:#BFE4F9;color:#2E9FD8}
.tag-green{background:rgba(228,248,239,.68);border-color:#BDEAD6;color:#26A97E}
.tag-yellow{background:rgba(255,248,220,.68);border-color:#F0E2A4;color:#B58E12}
.tag-x{
  position:absolute;top:-8px;right:-5px;width:19px;height:19px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:12px;font-style:normal;line-height:1;
  display:none;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;
}
.tag:hover .tag-x{display:flex}
.tag-x:hover{background:#E0392B}
#add-tag-btn{
  width:34px;height:34px;border-radius:50%;border:2px dashed var(--green);
  background:#fff;color:var(--green);font-size:19px;font-weight:700;cursor:pointer;transition:.3s;line-height:1;
}
#add-tag-btn:hover{transform:rotate(90deg) scale(1.1);background:#E9F8F1}
.color-dots{display:flex;gap:12px;margin:16px 0 4px}
.color-dot{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:.2s;padding:0}
.color-dot:hover{transform:scale(1.12)}
.color-dot.sel{border-color:var(--ink)}
.cd-blue{background:#7FCFF2}
.cd-green{background:#5FDDB0}
.cd-yellow{background:#FFD94D}
.sec-title{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px;margin:30px 0 16px}
.sec-title::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(63,184,232,.4),rgba(62,206,159,.25),transparent)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.info-card{
  display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.75);
  transition:.25s;
}
.info-card:hover{transform:translateY(-4px)}
.ic{width:44px;height:44px;border-radius:14px;background:rgba(230,246,239,.75);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.il{font-size:12px;color:var(--ink-soft);letter-spacing:.12em}
.iv{font-weight:600;margin-top:3px}
.recent-item{display:flex;align-items:center;gap:12px;padding:14px 0;font-size:15px;border-bottom:1px solid var(--line)}
.recent-item span{font-size:20px}

/* ================= My World ================= */
.world-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;margin-bottom:24px;border-radius:24px}
#hobby-tabs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hobby-chip{
  position:relative;display:inline-flex;align-items:center;gap:7px;
  padding:9px 18px;border-radius:999px;border:2px solid var(--line);
  background:rgba(255,255,255,.65);font-size:14px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;transition:.2s;
}
.hobby-chip:hover{transform:translateY(-2px);color:var(--ink);border-color:#BFE8DA}
.hobby-chip.active{
  color:#fff;background:linear-gradient(120deg,var(--blue),var(--green));
  border-color:transparent;box-shadow:0 8px 18px rgba(63,184,232,.35);
}
.chip-x{
  position:absolute;top:-8px;right:-4px;width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:13px;font-style:normal;line-height:1;
  display:none;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;
}
.hobby-chip:hover .chip-x{display:flex}
.chip-x:hover{background:#E0392B;transform:scale(1.15)}
#add-hobby-btn{
  width:40px;height:40px;border-radius:50%;border:2px dashed var(--blue);
  background:#fff;color:var(--blue);font-size:22px;font-weight:700;cursor:pointer;
  transition:.3s;flex:none;line-height:1;
}
#add-hobby-btn:hover{transform:rotate(90deg) scale(1.1);background:#E7F6EF}
.no-hobby-hint{font-size:14px;color:var(--ink-soft)}

/* ================= 动态流（Journal / 爱好主页通用） ================= */
.feed-banner{position:relative;border-radius:var(--radius);margin-bottom:26px;box-shadow:var(--shadow)}
.journal-banner{
  height:220px;margin-bottom:52px;
  background:linear-gradient(120deg,#4FBEF0,#3ECE9F 62%,#8FE3C6);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  padding:0 38px;color:#fff;
}
.jb-title{font-size:46px;font-weight:700;letter-spacing:.06em;text-shadow:0 4px 18px rgba(0,0,0,.15)}
.jb-sub{letter-spacing:.42em;font-size:14px;opacity:.95;margin-top:8px;text-indent:.42em}
.jb-deco span{position:absolute;opacity:.85;animation:floaty 5s ease-in-out infinite}
.jb-deco span:nth-child(1){top:22px;left:26px;font-size:18px}
.jb-deco span:nth-child(2){top:28px;right:130px;font-size:26px;animation-delay:.6s}
.jb-deco span:nth-child(3){bottom:30px;left:42%;font-size:16px;animation-delay:1.1s}
.jb-deco span:nth-child(4){top:46%;right:44px;font-size:20px;animation-delay:1.6s}
.jb-id{position:absolute;right:28px;bottom:-26px;display:flex;align-items:center;gap:14px}
.jb-name{color:#fff;font-weight:700;font-size:18px;text-shadow:0 2px 8px rgba(0,0,0,.25);padding-bottom:26px}
.jb-avatar{
  width:66px;height:66px;border-radius:18px;
  background:linear-gradient(135deg,var(--blue),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:34px;
  border:3px solid #fff;box-shadow:var(--shadow);
}
.hobby-banner{
  background:linear-gradient(120deg,rgba(255,255,255,.8),rgba(240,250,245,.6));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:18px;padding:22px 28px;
  border:1px solid rgba(255,255,255,.8);
}
.hb-icon{
  width:60px;height:60px;border-radius:18px;flex:none;
  background:linear-gradient(135deg,var(--blue),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 6px 14px rgba(62,206,159,.4);
}
.hb-name{font-size:26px;font-weight:700}
.hb-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;letter-spacing:.12em}

/* 发布器 */
.composer{padding:18px 20px;margin-bottom:20px}
.composer textarea{
  width:100%;border:none;outline:none;resize:none;font-size:15px;
  font-family:inherit;background:transparent;min-height:56px;line-height:1.7;color:var(--ink);
}
.composer textarea::placeholder{color:#C3B8CE}
.composer-foot{display:flex;align-items:center;gap:10px;margin-top:10px;border-top:1px solid var(--line);padding-top:12px}
.tool-btn{
  border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;transition:.2s;
}
.tool-btn:hover{border-color:var(--blue);color:var(--blue)}
.publish-btn{
  margin-left:auto;border:none;border-radius:999px;padding:9px 26px;
  font-size:14px;font-weight:600;color:#fff;letter-spacing:.1em;
  background:linear-gradient(120deg,var(--blue),var(--green));
  cursor:pointer;box-shadow:0 6px 16px rgba(63,184,232,.35);transition:.2s;
}
.publish-btn:hover{transform:translateY(-2px)}
.publish-btn:disabled{opacity:.6;cursor:wait;transform:none}
.previews{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.previews:empty{display:none}
.pv{position:relative;width:74px;height:74px}
.pv img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:2px solid #DEF2E8}
.pv i{
  position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:var(--ink);
  color:#fff;border-radius:50%;font-style:normal;font-size:12px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* 动态列表 */
.post{display:flex;gap:14px;padding:18px 20px;margin-bottom:16px}
.post-avatar{
  width:46px;height:46px;border-radius:14px;flex:none;overflow:hidden;
  background:linear-gradient(135deg,var(--blue),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:inset 0 0 0 2px #fff;
}
.post-main{flex:1;min-width:0}
.post-name{font-weight:600;color:#2E9FD8}
.post-text{margin-top:5px;font-size:15px;line-height:1.75;word-break:break-word;white-space:pre-wrap}
.post-imgs{display:grid;gap:6px;margin-top:10px;max-width:420px}
.post-imgs.g1{grid-template-columns:1fr;max-width:260px}
.post-imgs.g2{grid-template-columns:1fr 1fr;max-width:340px}
.post-imgs.g3{grid-template-columns:repeat(3,1fr)}
.post-imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in;transition:.2s}
.post-imgs.g1 img{aspect-ratio:auto;max-height:320px}
.post-imgs img:hover{transform:scale(1.02);filter:brightness(1.05)}
.post-foot{display:flex;align-items:center;margin-top:10px}
.post-time{font-size:12px;color:var(--ink-soft)}
.post-ops{margin-left:auto;display:flex;gap:6px;align-items:center}
.post-ops button{
  border:none;background:transparent;cursor:pointer;font-size:13px;
  color:var(--ink-soft);border-radius:999px;padding:5px 10px;transition:.2s;font-weight:700;
}
.post-ops .op-pill{background:rgba(255,255,255,.6)}
.post-ops button:hover{background:#DFF3EA;color:var(--blue)}
.op-pill.on{color:var(--blue)}
.feedback{margin-top:10px;background:rgba(255,255,255,.5);border-radius:12px;padding:4px 14px;font-size:14px}
.feedback.fb-empty{display:none}
/* ---------- 置顶 / 私密 / 更多菜单 ---------- */
.post.is-pinned{border-left:4px solid var(--green)}
.post.is-private{background:rgba(255,253,240,.7)}
.post-badge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;vertical-align:2px}
.badge-pin{background:#E4F8EF;color:#26A97E;border:1px solid #BDEAD6}
.badge-lock{background:#FFF6D8;color:#B58E12;border:1px solid #F0E2A4}
.more-wrap{position:relative;display:inline-flex}
/* 菜单打开时提升整张卡片层级，避免被下一条记录遮挡（backdrop-filter 会创建层叠上下文） */
.post.menu-open{position:relative;z-index:70}
.more-menu{
  position:absolute;right:0;top:calc(100% + 6px);z-index:60;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:14px;border:1px solid rgba(255,255,255,.9);
  box-shadow:0 14px 34px rgba(61,82,97,.18);
  padding:6px;min-width:134px;display:none;flex-direction:column;
}
.more-menu:not([hidden]){display:flex}
.more-menu button{border:none;background:transparent;text-align:left;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.more-menu button:hover{background:#EFF8F3;color:#2E9FD8}
.more-menu button.danger:hover{background:#FDEEEC;color:#E0392B}
/* ---------- 信息卡可编辑 ---------- */
.info-card{position:relative;cursor:pointer}
.ic-edit{position:absolute;top:8px;right:10px;font-size:12px;opacity:0;transition:.2s}
body.is-admin .info-card .ic-edit, body.is-admin .intro-card .ic-edit{opacity:0}
body.is-admin .info-card:hover .ic-edit, body.is-admin .intro-card:hover .ic-edit{opacity:.9}
/* ---------- 音乐分享卡片 ---------- */
.post-tracks{display:flex;flex-direction:column;gap:10px;margin-top:10px;max-width:440px}
.track-card{
  display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(97,160,140,.1);
}
.track-cover{
  width:58px;height:58px;border-radius:14px;flex:none;overflow:hidden;
  background:linear-gradient(135deg,var(--blue),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;
  box-shadow:0 4px 12px rgba(63,184,232,.3);
}
.track-cover.spinning .track-note{display:inline-block;animation:spin 3s linear infinite}
.track-info{flex:1;min-width:0}
.track-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-player{display:flex;align-items:center;gap:8px;margin-top:8px}
.tp-btn{
  width:28px;height:28px;border-radius:50%;border:none;flex:none;
  background:linear-gradient(120deg,var(--blue),var(--green));color:#fff;
  font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;
}
.tp-btn:hover{transform:scale(1.1)}
.tp-bar{flex:1;height:5px;border-radius:4px;background:rgba(63,184,232,.18);cursor:pointer;overflow:hidden}
.tp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:4px}
.tp-time{font-size:11px;color:var(--ink-soft);flex:none;min-width:78px;text-align:right}
.pv-track{
  position:relative;display:inline-flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:14px;max-width:250px;
  background:rgba(255,255,255,.7);border:1px solid #DEF2E8;
}
.pv-track-icon{
  width:32px;height:32px;border-radius:10px;flex:none;color:#fff;font-size:16px;overflow:hidden;
  background:linear-gradient(135deg,var(--blue),var(--green));
  display:flex;align-items:center;justify-content:center;
}
.pv-track-text{min-width:0;display:flex;flex-direction:column}
.pv-track-text b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.pv-track-text small{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.pv-track-edit{font-style:normal;font-size:12px;cursor:pointer;opacity:.65;flex:none}
.pv-track-edit:hover{opacity:1}
.pv-track-x{
  position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:var(--ink);
  color:#fff;border-radius:50%;font-style:normal;font-size:12px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
/* ---------- 头像 / 个人资料 ---------- */
.avatar-img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.about-avatar{cursor:pointer}
.avatar-edit{
  position:absolute;bottom:-5px;right:-5px;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;
  font-size:12px;box-shadow:var(--shadow);
}
.profile-edit-row{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.profile-avatar-preview{
  width:84px;height:84px;border-radius:50%;flex:none;overflow:hidden;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:38px;
  border:3px solid rgba(255,255,255,.9);box-shadow:var(--shadow);
}
.profile-avatar-preview img{width:100%;height:100%;object-fit:cover}
.profile-edit-hint{font-size:12px;color:var(--ink-soft);line-height:1.8}
/* ---------- 专辑封面上传 ---------- */
.te-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.te-cover{
  width:72px;height:72px;border-radius:16px;flex:none;overflow:hidden;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:28px;
  border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(63,184,232,.25);
}
.te-cover img{width:100%;height:100%;object-fit:cover}
.te-hint{font-size:12px;color:var(--ink-soft);line-height:1.8}
.track-cover img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
/* ---------- 自我介绍 / 联系方式 ---------- */
.intro-card{position:relative;padding:24px 28px;cursor:pointer}
#intro-text{line-height:2.1;white-space:pre-wrap;font-size:15px}
.contact-list{padding:8px 22px 14px}
.contact-item{position:relative;cursor:pointer}
.contact-text{flex:1;min-width:0}
.contact-text b{font-weight:600;margin-right:12px;color:var(--ink)}
.contact-x{
  position:absolute;right:2px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:12px;font-style:normal;display:none;align-items:center;justify-content:center;
  cursor:pointer;border:2px solid #fff;line-height:1;
}
.contact-item:hover .contact-x{display:flex}
.contact-x:hover{background:#E0392B}
.contact-list .recent-item:last-of-type{border-bottom:none}
.contact-add{
  width:100%;margin-top:8px;padding:10px;border:1.5px dashed var(--line);border-radius:14px;
  background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;font-weight:600;transition:.2s;
}
.contact-add:hover{border-color:var(--blue);color:var(--blue)}
.modal-textarea{
  width:100%;min-height:130px;border:2px solid var(--line);border-radius:14px;
  padding:12px 16px;font-size:15px;outline:none;font-family:inherit;
  resize:vertical;line-height:1.9;background:rgba(255,255,255,.7);
}
.modal-textarea:focus{border-color:var(--blue)}
.likes-row{padding:8px 0;font-weight:700;border-bottom:1px solid #DCEEE2;display:flex;align-items:baseline;gap:6px;min-width:0}
.likes-names{font-weight:500;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.likes-row:last-child{border-bottom:none}
.comment-list{list-style:none;padding:6px 0}
.comment-list li{position:relative;padding:4px 26px 4px 0;line-height:1.6;word-break:break-word}
.comment-list b{color:#2E9FD8}
.comment-x{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:11px;font-style:normal;display:none;align-items:center;justify-content:center;
  cursor:pointer;line-height:1;
}
.comment-list li:hover .comment-x{display:flex}
.comment-x:hover{background:#E0392B}
.comment-editor{display:none;gap:8px;padding:8px 0}
.comment-editor:not([hidden]){display:flex}
.comment-editor input{
  flex:1;border:2px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:13px;outline:none;font-family:inherit;
}
.comment-editor input:focus{border-color:var(--blue)}
.comment-editor button{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.empty{padding:60px 20px;text-align:center;color:var(--ink-soft);line-height:2}
.empty-emoji{font-size:52px;animation:floaty 4s ease-in-out infinite}

/* ================= 留言反馈 ================= */
.feedback-form{padding:22px 26px}
.fb-tip{font-size:13px;color:var(--ink-soft);line-height:1.8;margin-bottom:4px}
.fb-q{font-size:14px;font-weight:600;margin:18px 0 10px}
.fb-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb-opt{
  border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:999px;
  padding:7px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.2s;
}
.fb-opt:hover{border-color:var(--blue);color:var(--blue)}
.fb-opt.sel{border-color:var(--blue);color:var(--blue);background:rgba(228,243,253,.7)}
.fb-other-input{
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;
  outline:none;font-family:inherit;width:150px;background:rgba(255,255,255,.7);
}
.fb-other-input:focus{border-color:var(--blue)}
.fb-submit{
  margin-top:20px;border:none;border-radius:999px;padding:10px 30px;
  background:linear-gradient(120deg,var(--blue),var(--green));color:#fff;
  font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 6px 16px rgba(63,184,232,.3);transition:.2s;
}
.fb-submit:hover{transform:translateY(-2px)}
.fb-admin-list{display:flex;flex-direction:column;gap:10px}
.fb-item{position:relative;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.75)}
.fb-meta{font-size:12px;color:var(--ink-soft);margin-bottom:6px;line-height:1.7}
.fb-meta b{color:var(--ink);margin-right:6px}
.fb-content-text{line-height:1.8;font-size:14px;white-space:pre-wrap;word-break:break-word}
.fb-x{
  position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:12px;font-style:normal;
  display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;
}
.fb-x:hover{background:#E0392B}

/* ================= AI Mirror 聊天 ================= */
@keyframes spin{to{transform:rotate(360deg)}}
.loading-dots{display:flex;gap:8px}
.loading-dots i{width:10px;height:10px;border-radius:50%;background:var(--blue);animation:bounce 1.2s infinite}
.loading-dots i:nth-child(2){animation-delay:.15s;background:var(--yellow)}
.loading-dots i:nth-child(3){animation-delay:.3s;background:var(--mint)}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.ai-chat{display:flex;flex-direction:column;max-height:calc(100vh - 140px);overflow:hidden}
.ai-head{display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.8)}
.ai-orb-small{
  position:relative;width:52px;height:52px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,#D9F0FF,#D8F7E8);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:var(--shadow);
}
.ai-orb-small::after{
  content:"";position:absolute;inset:-7px;border-radius:50%;
  border:2px dashed var(--sky);animation:spin 12s linear infinite;
}
.ai-head-text b{font-size:17px}
.ai-head-text p{font-size:12px;color:var(--ink-soft);margin-top:3px}
.ai-msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-height:280px}
.ai-msg{display:flex;gap:10px;max-width:88%}
.ai-msg .m-avatar{
  width:32px;height:32px;border-radius:50%;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;
  background:linear-gradient(135deg,#D9F0FF,#D8F7E8);
}
.ai-msg .m-avatar img{width:100%;height:100%;object-fit:cover}
.ai-msg .m-bubble{
  padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.7;
  background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 3px 10px rgba(97,160,140,.08);white-space:pre-wrap;word-break:break-word;
}
.ai-msg.user{align-self:flex-end;flex-direction:row-reverse}
.ai-msg.user .m-avatar{background:linear-gradient(135deg,var(--blue),var(--green))}
.ai-msg.user .m-bubble{
  background:linear-gradient(120deg,var(--blue),var(--green));color:#fff;border:none;
  box-shadow:0 6px 16px rgba(63,184,232,.25);
}
.ai-msg.thinking .m-bubble{color:var(--ink-soft);font-style:italic}
.ai-msg.error .m-bubble{background:#FDEEEC;color:#C0392B}
.ai-turnstile{padding:10px 20px 0;display:flex;justify-content:flex-end}

/* ================= 分身资料库（站长管理界面） ================= */
.plib-tip{font-size:12px;color:var(--ink-soft);line-height:1.7;margin:8px 0 12px;padding:8px 12px;background:rgba(63,184,232,.08);border-radius:10px}
.plib-tabs{display:flex;gap:8px;margin-bottom:12px}
.plib-tabs button{flex:1;padding:9px;border-radius:12px;border:1.5px solid rgba(63,184,232,.3);background:rgba(255,255,255,.6);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);transition:all .2s}
.plib-tabs button.active{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(63,184,232,.3)}
.plib-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.plib-empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:24px 0}
.plib-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:12px;font-size:13px}
.plib-row .pc{flex-shrink:0;background:rgba(63,184,232,.14);color:#2a7ca8;border-radius:8px;padding:2px 7px;font-size:11px}
.plib-row .pk{font-weight:600;flex-shrink:0;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plib-row .pv{flex:1;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.plib-row .pa{flex-shrink:0;display:flex;gap:4px}
.plib-row .pa button{border:none;background:rgba(97,160,140,.1);border-radius:8px;padding:4px 7px;cursor:pointer;font-size:12px;transition:background .2s}
.plib-row .pa button:hover{background:rgba(97,160,140,.25)}
.plib-form label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:10px 0 4px}
.plib-form select{width:100%;padding:9px 12px;border-radius:12px;border:1.5px solid rgba(63,184,232,.25);background:rgba(255,255,255,.85);font-family:inherit;font-size:14px}
.plib-form textarea{width:100%;min-height:80px;padding:9px 12px;border-radius:12px;border:1.5px solid rgba(63,184,232,.25);background:rgba(255,255,255,.85);font-family:inherit;font-size:14px;resize:vertical;box-sizing:border-box}
.ai-input-row{display:flex;gap:10px;padding:16px 20px;border-top:1px solid rgba(255,255,255,.8)}
.ai-input-row input{
  flex:1;border:2px solid var(--line);border-radius:999px;background:rgba(255,255,255,.7);
  padding:11px 18px;font-size:14px;outline:none;font-family:inherit;
}
.ai-input-row input:focus{border-color:var(--blue)}
.ai-send-btn{
  border:none;border-radius:999px;padding:0 24px;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(120deg,var(--blue),var(--green));cursor:pointer;transition:.2s;
  box-shadow:0 6px 14px rgba(63,184,232,.28);
}
.ai-send-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(63,184,232,.36)}
.ai-send-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* ================= 弹窗 / 灯箱 / 提示 ================= */
.modal-mask{
  position:fixed;inset:0;background:rgba(61,82,97,.42);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:400;
}
.modal-mask.show{display:flex}
.modal{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:24px;padding:28px;width:min(400px,90vw);
  box-shadow:0 30px 60px rgba(61,82,97,.22);
  animation:pop .3s cubic-bezier(.22,1,.36,1);
}
.modal-title{font-size:19px;font-weight:700;margin-bottom:16px}
.modal-input{
  width:100%;border:2px solid var(--line);border-radius:14px;
  padding:12px 16px;font-size:15px;outline:none;font-family:inherit;
}
.modal-input:focus{border-color:var(--blue)}
/* 访客注册弹窗 */
.vr-avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.vr-avatar{
  width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--green));
  box-shadow:0 6px 16px rgba(63,184,232,.28);
}
.vr-avatar img{width:100%;height:100%;object-fit:cover}
.vr-upload{
  border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:999px;
  padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.2s;
}
.vr-upload:hover{border-color:var(--blue);color:var(--blue)}
.vr-emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.vr-emoji{border:2px solid var(--line);background:#fff;border-radius:10px;font-size:19px;padding:5px 0;cursor:pointer;transition:.15s}
.vr-emoji:hover{transform:scale(1.15);border-color:var(--blue)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0 4px}
.emoji-opt{border:2px solid var(--line);background:#fff;border-radius:12px;font-size:22px;padding:8px 0;cursor:pointer;transition:.15s}
.emoji-opt:hover{transform:scale(1.12)}
.emoji-opt.sel{border-color:var(--blue);background:#E7F6EF}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn-ghost{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 22px;font-weight:700;color:var(--ink-soft);cursor:pointer}
.btn-primary{border:none;border-radius:999px;padding:9px 26px;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--blue),var(--green));cursor:pointer}
.btn-danger{border:none;border-radius:999px;padding:9px 26px;font-weight:600;color:#fff;background:linear-gradient(120deg,#F0624F,#E0392B);cursor:pointer}
.confirm-text{font-size:15px;line-height:1.8}
.confirm-text small{color:var(--ink-soft)}
#lightbox{
  position:fixed;inset:0;background:rgba(38,54,64,.88);
  display:none;align-items:center;justify-content:center;z-index:500;cursor:zoom-out;
}
#lightbox.show{display:flex}
#lightbox img{max-width:88vw;max-height:88vh;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#toast{
  position:fixed;bottom:36px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 26px;border-radius:999px;
  font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:600;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ================= 响应式 ================= */
@media (max-width:840px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #sidebar{flex-direction:row;align-items:center;padding:12px 14px;gap:6px;overflow-x:auto;border-right:none;border-bottom:1px solid rgba(255,255,255,.8)}
  .logo{font-size:22px;padding:4px 8px}
  .nav-btn{padding:10px 13px;font-size:14px;flex:none}
  .sidebar-foot{display:none}
  #main{padding:22px 16px 70px}
  .jb-title{font-size:34px}
}
</style>

<body>

<!-- ================= 开场动画 ================= -->
<div id="intro">
  <span class="spark" style="top:16%;left:14%">✦</span>
  <span class="spark" style="top:24%;right:16%;animation-delay:.7s">⭐</span>
  <span class="spark" style="bottom:22%;left:20%;animation-delay:1.2s">🌙</span>
  <span class="spark" style="bottom:18%;right:22%;animation-delay:1.6s">✧</span>
  <span class="spark" style="top:48%;left:8%;animation-delay:2s">🎈</span>
  <span class="spark" style="top:40%;right:8%;animation-delay:2.4s">🍋</span>
  <div class="intro-word" id="w1">Mirror</div>
  <div class="intro-word" id="w2">记录正在发生的我</div>
  <div class="intro-skip">点 击 任 意 处 跳 过 ✦</div>
</div>

<!-- ================= 网站主体 ================= -->
<div id="app">
  <aside id="sidebar">
    <div class="logo"><span class="logo-emoji">🪞</span>Mirror</div>
    <button class="nav-btn active" data-m="about"><span class="nav-emoji">🫧</span>About Me</button>
    <button class="nav-btn" data-m="world"><span class="nav-emoji">🌍</span>My World</button>
    <button class="nav-btn" data-m="journal"><span class="nav-emoji">📖</span>Journal</button>
    <button class="nav-btn" data-m="ai"><span class="nav-emoji">🤖</span>AI Mirror</button>
    <div class="sidebar-foot">
      <div id="visitor-card" hidden title="点击修改我的资料">
        <span class="vc-avatar" id="vc-avatar">👤</span>
        <span class="vc-name" id="vc-name"></span>
      </div>
      <button class="replay-btn" id="admin-btn">🔑 站长登录</button>
      <button class="replay-btn admin-only" id="plib-btn">🧠 分身资料库</button>
      <button class="replay-btn" id="replay-intro">↻ 重播开场动画</button>
      <div class="foot-text">记录正在发生的我<br>✦ ✧ ✦</div>
    </div>
  </aside>

  <main id="main">

    <!-- About Me -->
    <section class="module active" id="mod-about">
      <div class="about-hero card">

/* IndexedDB：本地演示模式下存音乐文件 */
const idb = {
  db: null,
  open(){
    return new Promise((resolve, reject) => {
      if(this.db) return resolve(this.db);
      const rq = indexedDB.open('mirror-media', 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore('audio'); };
      rq.onsuccess = () => { this.db = rq.result; resolve(this.db); };
      rq.onerror = () => reject(rq.error);
    });
  },
  async put(key, blob){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('audio', 'readwrite');
      tx.objectStore('audio').put(blob, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  async get(key){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const rq = db.transaction('audio').objectStore('audio').get(key);
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    });
  },
  async del(key){
    try{
      const db = await this.open();
      return new Promise(resolve => {
        const tx = db.transaction('audio', 'readwrite');
        tx.objectStore('audio').delete(key);
        tx.oncomplete = () => resolve();
      });
    }catch(e){ return; }
  }
};

let toastTimer = null;
function toast(msg){

  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);

function timeAgo(ts){
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  const h = Math.floor(diff / 3600000);
  if(diff < 60000) return '刚刚';
  if(m < 60) return m + ' 分钟前';
  if(h < 24) return h + ' 小时前';
  const dt = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  if(dt.getFullYear() === new Date().getFullYear())
    return (dt.getMonth() + 1) + '月' + dt.getDate() + '日 ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
  return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
}

function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1000;
        let w = img.width, h = img.height;
        if(Math.max(w, h) > max){
          const r = max / Math.max(w, h);
          w = Math.round(w * r); h = Math.round(h * r);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', .85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataURLtoBlob(dataURL){
  const arr = dataURL.split(',');
  const mime = (arr[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(arr[1]);
  const u8 = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: mime });
}
/* 云模式：上传文件到 Supabase Storage，返回公开 URL */
async function cloudUpload(bucket, blobOrFile, ext){
  const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
  const { error } = await sb.storage.from(bucket).upload(path, blobOrFile, { cacheControl: '31536000' });
  if(error) throw error;
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}
function storagePathFromUrl(url){
  const m = String(url).match(/\/storage\/v1\/object\/public\/([^/]+)\/(.+)$/);
  return m ? { bucket: m[1], path: m[2] } : null;
}
async function cloudRemoveByUrl(url){
  const info = storagePathFromUrl(url);
  if(info){ try{ await sb.storage.from(info.bucket).remove([info.path]); }catch(e){} }
}

function visitorProfile(){

}
/* 头像 HTML：dataURL 用 img，否则显示 emoji（默认 👤） */
function avatarHTML(avatar){
  if(avatar && avatar.indexOf('data:') === 0) return '<img src="' + avatar + '" alt="">';
  return escapeHTML(avatar || '👤');
}
/* 上传图片 → 居中裁剪压缩为 128px dataURL（只存访客自己浏览器，不占云端） */
function fileToAvatar(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(img.width, img.height);
        const c = document.createElement('canvas');
        c.width = c.height = 128;
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
        resolve(c.toDataURL('image/jpeg', .85));
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

    box.querySelector('[data-a=ok]').onclick = async () => {
      const v = $('#visitor-name-input').value.trim();
      if(!v){ toast('写个昵称吧～'); return; }
      const oldName = cur.name;

      resolve(v);
    };
    setTimeout(() => { const inp = $('#visitor-name-input'); if(inp) inp.focus(); }, 60);
  });
}

/* ================= 分身资料库（站长专属 · 公开/私密双域） =================
 * 公开资料：访客版 AI 也能读到（会拼进访客对话的上下文）
 * 私密资料：只有你登录后，AI 才认识；访客在任何层面都接触不到
 * 拿不准放哪的资料：一律放私密（default private 原则） */
const PLIB_CATEGORIES = {
  public: ['basic_info', 'interests', 'favorites', 'experiences', 'stories', 'self_description', 'misc'],
  private: ['personal', 'relationships', 'diary', 'secrets', 'misc']
};
const PLIB_CAT_LABEL = {
  basic_info:'基本信息', interests:'兴趣爱好', favorites:'喜欢的事物', experiences:'经历',
  stories:'故事', self_description:'自我描述', personal:'私人信息', relationships:'私人关系',
  diary:'日记心绪', secrets:'机密', misc:'其他'
};
let plibScope = 'public';
const plibTable = () => plibScope === 'private' ? 'private_profile' : 'public_profile';

async function plibLoad(){
  const { data, error } = await sb.from(plibTable()).select('*').order('sort').order('ts');
  if(error){ toast('读取资料库失败：' + error.message); return []; }
  return data || [];
}
function plibRowHTML(r){
  const cat = PLIB_CAT_LABEL[r.category] || r.category;
  return '<div class="plib-row" data-id="' + r.id + '">' +
    '<span class="pc">' + escapeHTML(cat) + '</span>' +
    '<span class="pk" title="' + escapeHTML(r.key) + '">' + escapeHTML(r.key) + '</span>' +
    '<span class="pv" title="' + escapeHTML(r.value) + '">' + escapeHTML(r.value) + '</span>' +
    '<span class="pa">' +
      '<button data-a="edit" title="编辑">✏️</button>' +
      '<button data-a="move" title="' + (plibScope === 'public' ? '移到私密' : '移到公开') + '">' + (plibScope === 'public' ? '🔒' : '🌍') + '</button>' +
      '<button data-a="del" title="删除">🗑</button>' +
    '</span>' +
  '</div>';
}
async function plibRenderList(box){
  const rows = await plibLoad();
  const list = box.querySelector('.plib-list');
  list.innerHTML = rows.length ? rows.map(plibRowHTML).join('') : '<div class="plib-empty">这个域还没有资料，点下方按钮新增一条吧</div>';
  list.querySelectorAll('.plib-row').forEach(rowEl => {
    const row = rows.find(r => r.id === rowEl.dataset.id);
    rowEl.querySelector('[data-a=edit]').onclick = () => plibForm(box, row);
    rowEl.querySelector('[data-a=del]').onclick = async () => {
      if(!confirm('删除「' + row.key + '」？删除后 AI 就不再知道这件事了')) return;
      const { error } = await sb.from(plibTable()).delete().eq('id', row.id);
      if(error){ toast('删除失败：' + error.message); return; }
      toast('已删除 🗑');
      plibRenderList(box);
    };
    rowEl.querySelector('[data-a=move]').onclick = async () => {
      const to = plibScope === 'public' ? '私密 🔒' : '公开 🌍';
      const warn = plibScope === 'private'
        ? '移到「公开」后，访客版 AI 也能看到这条资料，确定吗？'
        : '移到「私密」后，只有你能和 AI 聊起它，确定吗？';
      if(!confirm(warn)) return;
      const other = plibScope === 'public' ? 'private_profile' : 'public_profile';
      const { error: e1 } = await sb.from(other).upsert(
        { category: row.category, key: row.key, value: row.value, sort: row.sort },
        { onConflict: 'category,key' }
      );
      if(e1){ toast('移动失败：' + e1.message); return; }
      const { error: e2 } = await sb.from(plibTable()).delete().eq('id', row.id);
      if(e2){ toast('移动失败：' + e2.message); return; }
      toast('已移到' + to);
      plibRenderList(box);
    };
  });
}
function plibForm(box, row){
  const isEdit = !!row;
  const cats = PLIB_CATEGORIES[plibScope];
  const scopeName = plibScope === 'public' ? '公开 🌍' : '私密 🔒';
  box.innerHTML =
    '<h3 class="modal-title">' + (isEdit ? '编辑' : '新增') + '条目（' + scopeName + '域）</h3>' +
    '<div class="plib-form">' +
      '<label>分类</label>' +
      '<select id="pf-cat">' + cats.map(c => '<option value="' + c + '"' + (isEdit && row.category === c ? ' selected' : '') + '>' + (PLIB_CAT_LABEL[c] || c) + '（' + c + '）</option>').join('') + '</select>' +
      '<label>条目名（如：昵称、电影、梦想）</label>' +
      '<input id="pf-key" class="modal-input" maxlength="30" value="' + (isEdit ? escapeHTML(row.key) : '') + '" placeholder="这条资料叫什么" />' +
      '<label>内容</label>' +
      '<textarea id="pf-value" maxlength="500" placeholder="AI 会按你写的内容来认识你">' + (isEdit ? escapeHTML(row.value) : '') + '</textarea>' +
    '</div>' +
    '<div class="modal-actions"><button class="btn-ghost" data-a="back">返回</button><button class="btn-primary" data-a="save">保存</button></div>';
  box.querySelector('[data-a=back]').onclick = () => plibOpen();
  box.querySelector('[data-a=save]').onclick = async () => {
    const category = box.querySelector('#pf-cat').value;
    const key = box.querySelector('#pf-key').value.trim();
    const value = box.querySelector('#pf-value').value.trim();
    if(!key || !value){ toast('条目名和内容都要填哦'); return; }
    const payload = { category: category, key: key, value: value };
    if(isEdit) payload.id = row.id;
    const { error } = await sb.from(plibTable()).upsert(payload, { onConflict: 'category,key' });
    if(error){ toast('保存失败：' + error.message); return; }
    toast(isEdit ? '已保存 ✏️' : '已录入，AI 现在知道这件事了 🧠');
    plibOpen();
  };
}
async function plibOpen(){
  if(!CLOUD_ON){ toast('资料库需要云端模式'); return; }
  if(!isAdmin){ toast('只有站长能管理资料库'); return; }
  openModal(
    '<h3 class="modal-title">🧠 分身资料库</h3>' +
    '<div class="plib-tip">🌍 <b>公开资料</b>：访客和 AI 都能看到 · 🔒 <b>私密资料</b>：只有你登录后 AI 才认识。拿不准的一律放私密。</div>' +
    '<div class="plib-tabs">' +
      '<button data-s="public"' + (plibScope === 'public' ? ' class="active"' : '') + '>🌍 公开资料</button>' +
      '<button data-s="private"' + (plibScope === 'private' ? ' class="active"' : '') + '>🔒 私密资料</button>' +
    '</div>' +
    '<div class="plib-list"><div class="plib-empty">读取中…</div></div>' +
    '<div class="modal-actions"><button class="btn-ghost" data-a="close">关闭</button><button class="btn-primary" data-a="add">＋ 新增条目</button></div>'
  );
  const box = $('#modal-box');
  box.querySelectorAll('.plib-tabs button').forEach(b => b.onclick = () => {
    plibScope = b.dataset.s;
    plibOpen();
  });
  box.querySelector('[data-a=close]').onclick = closeModal;
  box.querySelector('[data-a=add]').onclick = () => plibForm(box, null);
  await plibRenderList(box);
}

  toast('感谢你的反馈！💚');
  renderFeedbackAdmin();
});
async function renderFeedbackAdmin(){
  const listEl = $('#fb-admin-list');
  if(!isAdmin){ listEl.innerHTML = ''; return; }
  let items = [];
  if(CLOUD_ON){
    const { data, error } = await sb.from('feedback').select('*').order('ts', { ascending: false });
    if(error){ listEl.innerHTML = '<div class="empty card"><p>反馈加载失败</p></div>'; return; }
    items = (data || []).map(f => ({ id: f.id, name: f.name || '', relation: f.relation, relation_other: f.relation_other, device: f.device, device_other: f.device_other, content: f.content, ts: new Date(f.ts).getTime() }));
  }else{
    items = store.get('mirror_feedback', []);
  }
  if(!items.length){
    listEl.innerHTML = '<div class="empty card"><div class="empty-emoji">📭</div><p>还没有收到反馈</p></div>';
    return;
  }
  listEl.innerHTML = items.map(f => {
    const rel = f.relation === '其他' && f.relation_other ? '其他（' + escapeHTML(f.relation_other) + '）' : escapeHTML(f.relation);
    const dev = f.device === '其他' && f.device_other ? '其他（' + escapeHTML(f.device_other) + '）' : escapeHTML(f.device);
    return '<div class="fb-item" data-id="' + f.id + '">' +
      '<div class="fb-meta"><b>' + (f.name ? escapeHTML(f.name) : '匿名') + '</b>（' + rel + '）使用 <b>' + dev + '</b>· ' + timeAgo(f.ts) + '</div>' +
      '<div class="fb-content-text">' + escapeHTML(f.content) + '</div>' +
      '<i class="fb-x" data-x="' + f.id + '" title="删除反馈">×</i>' +
    '</div>';
  }).join('');
}
$('#fb-admin-list').addEventListener('click', e => {
  if(!isAdmin) return;
  const x = e.target.closest('.fb-x');
  if(!x) return;
  confirmDialog('确定删除这条反馈吗？').then(async ok => {
    if(!ok) return;
    if(CLOUD_ON){
      await sb.from('feedback').delete().eq('id', x.dataset.x);
    }else{
      const arr = store.get('mirror_feedback', []).filter(f => String(f.id) !== String(x.dataset.x));
      store.set('mirror_feedback', arr);
    }
    renderFeedbackAdmin();
    toast('已删除');
  });
});

/* ================= 动态流组件（Journal 与爱好主页共用） ================= */
function createFeed(mount, feedKey, opts){
  opts = opts || {};
  const getNick = () => profile.nickname;
  const pending = [];
  const storageKey = 'mirror_posts_' + feedKey; /* 本地模式存储键 */
  let currentPosts = [];

  mount.innerHTML =
    (opts.bannerHTML || '') +
    '<section class="composer card admin-only">' +
      '<textarea rows="2" placeholder="' + (opts.placeholder || '分享此刻的想法…') + '"></textarea>' +
      '<div class="previews"></div>' +
      '<div class="composer-foot">' +
        '<button type="button" class="tool-btn" data-role="pick">📷 图片</button>' +
        '<button type="button" class="tool-btn" data-role="pick-audio">🎵 音乐</button>' +
        '<span class="count-hint"></span>' +
        '<button type="button" class="publish-btn" data-role="publish">发 表</button>' +
      '</div>' +
      '<input type="file" accept="image/*" multiple hidden />' +
      '<input type="file" accept="audio/*" multiple hidden />' +
    '</section>' +
    '<section class="posts"></section>';

  const ta = mount.querySelector('textarea');
  const fileInput = mount.querySelector('input[accept^="image"]');
  const audioInput = mount.querySelector('input[accept^="audio"]');
  const pendingTracks = [];
  const previews = mount.querySelector('.previews');
  const postsEl = mount.querySelector('.posts');
  const countHint = mount.querySelector('.count-hint');
  const publishBtn = mount.querySelector('[data-role=publish]');

  /* ---------- 数据加载 ---------- */
  async function loadPosts(){
    if(CLOUD_ON){
      let q = sb.from('posts').select('*').eq('feed', feedKey)
        .order('pinned', { ascending: false }).order('ts', { ascending: false });
      if(!isAdmin) q = q.eq('private', false);
      const { data, error } = await q;
      if(error){ toast('动态加载失败'); return []; }
      const rows = data || [];
      const ids = rows.map(p => p.id);
      let commentRows = [];
      if(ids.length){
        const { data: cs } = await sb.from('comments').select('*').in('post_id', ids).order('ts', { ascending: true });
        commentRows = cs || [];
      }
      const likedSet = store.get('mirror_liked_ids', {});
      let likeRows = [];
      if(ids.length){
        const { data: ls } = await sb.from('likes').select('post_id,name').in('post_id', ids).order('ts', { ascending: true });
        likeRows = ls || [];
      }
      const myName = currentName();
      return rows.map(p => {
        const likers = likeRows.filter(l => l.post_id === p.id).map(l => l.name);
        return {
          id: p.id,
          text: p.text || '',
          images: p.images || [],
          tracks: p.tracks || [],
          ts: new Date(p.ts).getTime(),
          pinned: !!p.pinned,
          private: !!p.private,
          likeCount: likers.length || p.like_count || 0,
          likers: likers,
          liked: (myName && likers.indexOf(myName) > -1) || !!likedSet[p.id],
          comments: commentRows.filter(c => c.post_id === p.id)
            .map(c => ({ cid: c.id, name: c.name, text: c.text, ts: new Date(c.ts).getTime() }))
        };
      });
    }
    /* 本地模式 */
    const rows = store.get(storageKey, []);
    return rows.map((p, idx) => {
      const likers = Array.isArray(p.likers) ? p.likers : (p.liked ? [profile.nickname] : []);
      return {
        id: p.id,
        text: p.text || '',
        images: p.images || [],
        tracks: p.tracks || [],
        ts: p.ts,
        pinned: !!p.pinned,
        private: !!p.private,
        likeCount: likers.length,
        likers: likers,
        liked: likers.indexOf(profile.nickname) > -1,
        comments: (p.comments || []).map((c, ci) => ({ cid: ci, name: c.name, text: c.text, ts: c.ts }))
      };
    });
  }
  const saveLocalPosts = () => {
    if(!CLOUD_ON){
      store.set(storageKey, currentPosts.map(p => ({
        id: p.id, text: p.text, images: p.images, tracks: p.tracks, ts: p.ts,
        pinned: p.pinned, private: p.private, liked: p.liked,
        likers: Array.isArray(p.likers) ? p.likers : [],
        comments: p.comments.map(c => ({ name: c.name, text: c.text, ts: c.ts }))
      })));
    }
  };

  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
  });

  mount.querySelector('[data-role=pick]').addEventListener('click', () => { if(isAdmin) fileInput.click(); });
  fileInput.addEventListener('change', async e => {
    for(const f of e.target.files){
      try{ pending.push(await fileToDataURL(f)); }catch(err){ /* 忽略读取失败的文件 */ }
    }
    fileInput.value = '';
    renderPreviews();
  });

  mount.querySelector('[data-role=pick-audio]').addEventListener('click', () => { if(isAdmin) audioInput.click(); });
  audioInput.addEventListener('change', e => {
    for(const f of e.target.files){
      pendingTracks.push({
        tid: 't' + Date.now() + Math.floor(Math.random() * 999),
        blob: f,
        fileName: f.name,
        name: f.name.replace(/\.[^.]+$/, ''),
        album: '',
        artist: '未知歌手',
        cover: null
      });
    }
    audioInput.value = '';
    renderPreviews();
  });

  function renderPreviews(){
    previews.innerHTML = pending.map((s, i) =>
      '<span class="pv"><img src="' + s + '"><i data-i="' + i + '">×</i></span>'
    ).join('') + pendingTracks.map((t, i) =>
      '<span class="pv-track"><span class="pv-track-icon">' + (t.cover ? '<img src="' + t.cover + '">' : '🎵') + '</span>' +
      '<span class="pv-track-text"><b>' + escapeHTML(t.name) + '</b><small>' + escapeHTML(t.artist) + (t.album ? ' · ' + escapeHTML(t.album) : '') + '</small></span>' +
      '<em class="pv-track-edit" data-te="' + i + '" title="编辑歌曲信息">✏️</em>' +
      '<i class="pv-track-x" data-t="' + i + '">×</i></span>'
    ).join('');
    const total = pending.length + pendingTracks.length;
    countHint.textContent = total ? total + ' 个附件' : '';
    previews.querySelectorAll('.pv i').forEach(x => x.onclick = () => {
      pending.splice(Number(x.dataset.i), 1);
      renderPreviews();
    });
    previews.querySelectorAll('.pv-track-x').forEach(x => x.onclick = () => {
      pendingTracks.splice(Number(x.dataset.t), 1);
      renderPreviews();
    });
    previews.querySelectorAll('.pv-track-edit').forEach(x => x.onclick = () => {
      showTrackEdit(pendingTracks[Number(x.dataset.te)]);
    });
  }

  function showTrackEdit(t){
    if(!t || !isAdmin) return;
    let cover = t.cover || null;
    openModal(
      '<h3 class="modal-title">歌曲信息 🎵</h3>' +
      '<div class="te-row">' +
        '<div class="te-cover" id="te-cover" title="点击上传专辑封面">' + (cover ? '<img src="' + cover + '">' : '🎵') + '</div>' +
        '<div class="te-hint">点击左侧方块上传专辑封面<br>（可选）</div>' +
      '</div>' +
      '<input id="track-name-input" class="modal-input" maxlength="40" placeholder="歌名" value="' + escapeHTML(t.name) + '" style="margin-bottom:10px" />' +
      '<input id="track-album-input" class="modal-input" maxlength="40" placeholder="专辑名（可选）" value="' + escapeHTML(t.album || '') + '" style="margin-bottom:10px" />' +
      '<input id="track-artist-input" class="modal-input" maxlength="30" placeholder="歌手" value="' + escapeHTML(t.artist) + '" />' +
      '<div class="modal-actions"><button class="btn-ghost" data-a="cancel">取消</button><button class="btn-primary" data-a="ok">保存</button></div>'
    );
    const box = $('#modal-box');
    const cv = $('#te-cover');
    cv.onclick = () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.onchange = async () => {
        if(inp.files && inp.files[0]){
          try{
            cover = await fileToDataURL(inp.files[0]);
            cv.innerHTML = '<img src="' + cover + '">';
          }catch(err){ toast('图片读取失败'); }
        }
      };
      inp.click();
    };
    box.querySelector('[data-a=cancel]').onclick = closeModal;
    box.querySelector('[data-a=ok]').onclick = () => {
      const n = $('#track-name-input').value.trim();
      const al = $('#track-album-input').value.trim();
      const ar = $('#track-artist-input').value.trim();
      if(n) t.name = n;
      t.album = al;
      t.artist = ar || '未知歌手';
      t.cover = cover;
      closeModal();
      renderPreviews();
    };
  }

  /* ---------- 发布 ---------- */
  publishBtn.addEventListener('click', async () => {
    if(!isAdmin) return;
    const text = ta.value.trim();
    if(!text && !pending.length && !pendingTracks.length){ toast('说点什么吧～'); return; }
    publishBtn.disabled = true;
    publishBtn.textContent = '发表中…';
    try{
      if(CLOUD_ON){
        const imageUrls = [];
        for(const d of pending){
          try{ imageUrls.push(await cloudUpload('images', dataURLtoBlob(d), 'jpg')); }
          catch(e){ toast('有图片上传失败'); }
        }
        const tracks = [];
        for(const t of pendingTracks){
          try{
            const ext = (t.fileName.split('.').pop() || 'mp3').toLowerCase();
            const url = await cloudUpload('audio', t.blob, ext);
            let coverUrl = null;
            if(t.cover){
              try{ coverUrl = await cloudUpload('images', dataURLtoBlob(t.cover), 'jpg'); }catch(e){}
            }
            tracks.push({ url: url, name: t.name, album: t.album || '', artist: t.artist, cover: coverUrl });
          }catch(e){
            toast('「' + t.name + '」上传失败');
          }
        }
        const { error } = await sb.from('posts').insert({
          feed: feedKey, text: text, images: imageUrls, tracks: tracks,
          ts: new Date().toISOString(), pinned: false, private: false
        });
        if(error){ toast('发表失败，请检查网络'); return; }
      }else{
        const tracks = [];
        for(const t of pendingTracks){
          const mid = 'm' + Date.now() + Math.floor(Math.random() * 9999);
          try{
            await idb.put(mid, t.blob);
            tracks.push({ mid: mid, name: t.name, album: t.album || '', artist: t.artist, cover: t.cover || null });
          }catch(err){
            toast('「' + t.name + '」保存失败，文件可能太大了');
          }
        }
        const posts = store.get(storageKey, []);
        posts.unshift({
          id: 'p' + Date.now() + Math.floor(Math.random() * 999),
          text: text,
          images: pending.slice(),
          tracks: tracks,
          ts: Date.now(),
          liked: false,
          comments: [],
          pinned: false,
          private: false
        });
        store.set(storageKey, posts);
      }
      ta.value = ''; ta.style.height = 'auto';
      pending.length = 0;
      pendingTracks.length = 0;
      renderPreviews();
      await refresh();
      toast('发表成功 🎉');
    }finally{
      publishBtn.disabled = false;
      publishBtn.textContent = '发 表';
    }
  });

  /* ---------- 渲染 ---------- */
  function postHTML(p){
    const n = p.images.length;
    const gridCls = n === 1 ? 'g1' : (n === 2 || n === 4 ? 'g2' : 'g3');
    const hasFb = p.likeCount > 0 || p.comments.length > 0 || (p.likers && p.likers.length > 0);
    return '<article class="post card' + (p.pinned ? ' is-pinned' : '') + (p.private ? ' is-private' : '') + '" data-id="' + p.id + '">' +
      '<div class="post-avatar">' + profileAvatarHTML() + '</div>' +
      '<div class="post-main">' +
        '<div class="post-name">' + escapeHTML(getNick()) +
          (p.pinned ? '<span class="post-badge badge-pin">📌 置顶</span>' : '') +
          (p.private ? '<span class="post-badge badge-lock">🔒 私密</span>' : '') +
        '</div>' +
        (p.text ? '<div class="post-text">' + escapeHTML(p.text) + '</div>' : '') +
        (n ? '<div class="post-imgs ' + gridCls + '">' +
              p.images.map((s, i) => '<img src="' + s + '" data-img="' + i + '" loading="lazy">').join('') +
            '</div>' : '') +
        (p.tracks && p.tracks.length ?
          '<div class="post-tracks">' +
            p.tracks.map(t =>
              '<div class="track-card" data-mid="' + (t.mid || '') + '" data-url="' + (t.url || '') + '">' +
                '<div class="track-cover">' + (t.cover ? '<img src="' + t.cover + '" alt="">' : '<span class="track-note">🎵</span>') + '</div>' +
                '<div class="track-info">' +
                  '<div class="track-name">' + escapeHTML(t.name) + (t.album ? '-' + escapeHTML(t.album) : '') + '</div>' +
                  '<div class="track-artist">' + escapeHTML(t.artist) + '</div>' +
                  '<div class="track-player">' +
                    '<button type="button" class="tp-btn">▶</button>' +
                    '<div class="tp-bar"><div class="tp-fill"></div></div>' +
                    '<span class="tp-time">--:--</span>' +
                  '</div>' +
                '</div>' +
              '</div>'
            ).join('') +
          '</div>' : '') +
        '<div class="post-foot">' +
          '<span class="post-time">' + timeAgo(p.ts) + '</span>' +
          '<span class="post-ops">' +
            '<button data-op="like" class="op-pill' + (p.liked ? ' on' : '') + '">' + (p.liked ? '❤️' : '🤍') + ' 赞</button>' +
            '<button data-op="comment" class="op-pill">💬 评论</button>' +
            '<span class="more-wrap admin-only">' +
              '<button data-op="more" class="op-pill" title="更多">⋯</button>' +
              '<span class="more-menu" hidden>' +
                '<button data-op="pin">' + (p.pinned ? '📌 取消置顶' : '📌 置顶') + '</button>' +
                '<button data-op="private">' + (p.private ? '🔓 设为公开' : '🔒 设为私密') + '</button>' +
                '<button data-op="del" class="danger">🗑 删除</button>' +
              '</span>' +
            '</span>' +
          '</span>' +
        '</div>' +
        '<div class="feedback' + (hasFb ? '' : ' fb-empty') + '">' +
          ((p.likers && p.likers.length) ? '<div class="likes-row">❤️ ' + p.likers.length + '<span class="likes-names">' + p.likers.map(escapeHTML).join('、') + '</span></div>' : '') +
          (p.comments.length ?
            '<ul class="comment-list">' +
              p.comments.map(c =>
                '<li><span class="c-body"><b>' + escapeHTML(c.name) + '：</b>' + escapeHTML(c.text) + '</span>' +
                '<i class="comment-x admin-only" data-ci="' + c.cid + '" title="删除评论">×</i></li>'
              ).join('') +
            '</ul>' : '') +
          '<div class="comment-editor" hidden>' +
            '<input maxlength="200" placeholder="友善评论一下吧…" />' +
            '<button data-op="send">发送</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function renderList(posts){
    if(!posts.length){
      postsEl.innerHTML = '<div class="empty card"><div class="empty-emoji">🌱</div><p>' +
        (opts.emptyText || '还没有内容，来发第一条吧 ✨') + '</p></div>';
      return;
    }
    const sorted = posts.slice().sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || (b.ts - a.ts));
    postsEl.innerHTML = sorted.map(postHTML).join('');
    bindTracks();
  }

  async function refresh(){
    currentPosts = await loadPosts();
    renderList(currentPosts);
  }

  function bindAudioToCard(card, url){
    const audio = new Audio(url);
    card._audio = audio;
    const btn = card.querySelector('.tp-btn');
    const bar = card.querySelector('.tp-bar');
    const fill = card.querySelector('.tp-fill');
    const timeEl = card.querySelector('.tp-time');
    const cover = card.querySelector('.track-cover');
    const fmt = s => {
      if(!isFinite(s)) return '--:--';
      s = Math.floor(s);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    };
    audio.addEventListener('loadedmetadata', () => { timeEl.textContent = '0:00 / ' + fmt(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      if(audio.duration){
        fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
      }
    });
    audio.addEventListener('play', () => {
      document.querySelectorAll('.track-card').forEach(c => {
        if(c !== card && c._audio) c._audio.pause();
      });
      btn.textContent = '⏸';
      cover.classList.add('spinning');
    });
    const reset = () => { btn.textContent = '▶'; cover.classList.remove('spinning'); };
    audio.addEventListener('pause', reset);
    audio.addEventListener('ended', () => { reset(); fill.style.width = '0%'; });
    btn.onclick = () => { if(audio.paused) audio.play(); else audio.pause(); };
    bar.onclick = ev => {
      const r = bar.getBoundingClientRect();
      if(audio.duration && r.width) audio.currentTime = ((ev.clientX - r.left) / r.width) * audio.duration;
    };
  }
  function bindTracks(){
    postsEl.querySelectorAll('.track-card').forEach(card => {
      const url = card.dataset.url;
      if(url){ bindAudioToCard(card, url); return; }
      const mid = card.dataset.mid;
      if(!mid) return;
      idb.get(mid).then(blob => {
        if(!blob){ card.querySelector('.tp-time').textContent = '音频缺失'; return; }
        bindAudioToCard(card, URL.createObjectURL(blob));
      }).catch(() => {
        const timeEl = card.querySelector('.tp-time');
        if(timeEl) timeEl.textContent = '加载失败';
      });
    });
  }

  /* 评论/点赞前确保有昵称（askVisitorName 为全局函数） */
  async function commenterName(){
    let n = currentName();
    if(!n) n = await askVisitorName();
    return n;
  }

  async function sendComment(postEl, p, input){
    const v = input.value.trim();
    if(!v) return;
    const name = await commenterName();
    if(!name) return;
    if(CLOUD_ON){
      const { error } = await sb.from('comments').insert({ post_id: p.id, name: name, vid: visitorProfile().id, text: v, ts: new Date().toISOString() });
      if(error){ toast('评论失败，请稍后再试'); return; }
      await refresh();
    }else{
      p.comments.push({ cid: p.comments.length, name: name, text: v, ts: Date.now() });
      saveLocalPosts();
      renderList(currentPosts);
    }
  }

  /* ---------- 交互 ---------- */
  postsEl.addEventListener('click', async e => {
    const postEl = e.target.closest('.post');
    if(!postEl) return;
    const id = postEl.dataset.id;
    const p = currentPosts.find(x => String(x.id) === String(id));
    if(!p) return;

    const img = e.target.closest('img[data-img]');
    if(img){ openLightbox(p.images[Number(img.dataset.img)]); return; }

    const cx = e.target.closest('.comment-x');
    if(cx){
      if(!isAdmin) return;
      const c = p.comments.find(x => String(x.cid) === String(cx.dataset.ci));
      confirmDialog('删除这条评论吗？<br><small>「' + escapeHTML(c ? c.text : '') + '」</small>').then(async ok => {
        if(!ok) return;
        if(CLOUD_ON){
          await sb.from('comments').delete().eq('id', cx.dataset.ci);
          await refresh();
        }else{
          p.comments = p.comments.filter(x => String(x.cid) !== String(cx.dataset.ci))
            .map((x, i) => { x.cid = i; return x; });
          saveLocalPosts();
          renderList(currentPosts);
        }
        toast('评论已删除');
      });
      return;
    }

    const opBtn = e.target.closest('[data-op]');
    if(!opBtn) return;
    const op = opBtn.dataset.op;

    if(op === 'like'){
      const name = await commenterName();
      if(!name) return;
      const nowLiked = !p.liked;
      if(!Array.isArray(p.likers)) p.likers = [];
      if(CLOUD_ON){
        const { error } = await sb.rpc(nowLiked ? 'like_post' : 'unlike_post', { p_id: p.id, p_name: name, p_vid: visitorProfile().id });
        if(error){ toast('操作失败'); return; }
        if(nowLiked){ if(p.likers.indexOf(name) < 0) p.likers.push(name); }
        else p.likers = p.likers.filter(n => n !== name);
        p.liked = nowLiked;
        p.likeCount = p.likers.length;
        renderList(currentPosts);
      }else{
        if(nowLiked){ if(p.likers.indexOf(name) < 0) p.likers.push(name); }
        else p.likers = p.likers.filter(n => n !== name);
        p.liked = nowLiked;
        p.likeCount = p.likers.length;
        saveLocalPosts();
        renderList(currentPosts);
      }
    }else if(op === 'more'){
      if(!isAdmin) return;
      const menu = postEl.querySelector('.more-menu');
      const willOpen = menu.hidden;
      $$('.more-menu').forEach(m => { m.hidden = true; });
      $$('.post.menu-open').forEach(x => x.classList.remove('menu-open'));
      menu.hidden = !willOpen;
      if(willOpen) postEl.classList.add('menu-open');
    }else if(op === 'pin'){
      if(!isAdmin) return;
      if(CLOUD_ON){
        await sb.from('posts').update({ pinned: !p.pinned }).eq('id', p.id);
        await refresh();
      }else{
        p.pinned = !p.pinned;
        saveLocalPosts();
        renderList(currentPosts);
      }
      toast(!p.pinned ? '已置顶 📌' : '已取消置顶');
    }else if(op === 'private'){
      if(!isAdmin) return;
      if(CLOUD_ON){
        await sb.from('posts').update({ private: !p.private }).eq('id', p.id);
        await refresh();
      }else{
        p.private = !p.private;
        saveLocalPosts();
        renderList(currentPosts);
      }
      toast(p.private ? '已设为公开' : '已设为私密，只有自己看得见 🔒');
    }else if(op === 'del'){
      if(!isAdmin) return;
      confirmDialog('确定删除这条记录吗？').then(async ok => {
        if(!ok) return;
        if(CLOUD_ON){
          (p.images || []).forEach(u => cloudRemoveByUrl(u));
          (p.tracks || []).forEach(t => { if(t.url) cloudRemoveByUrl(t.url); if(t.cover) cloudRemoveByUrl(t.cover); });
          await sb.from('posts').delete().eq('id', p.id);
          await refresh();
        }else{
          if(p.tracks) p.tracks.forEach(t => { if(t.mid) idb.del(t.mid); });
          currentPosts = currentPosts.filter(x => String(x.id) !== String(id));
          saveLocalPosts();
          renderList(currentPosts);
        }
        toast('已删除');
      });
    }else if(op === 'comment'){
      const fb = postEl.querySelector('.feedback');
      const ed = postEl.querySelector('.comment-editor');
      fb.classList.remove('fb-empty');
      ed.hidden = !ed.hidden;
      if(!ed.hidden) ed.querySelector('input').focus();
      else if(!p.likeCount && !p.comments.length) fb.classList.add('fb-empty');
    }else if(op === 'send'){
      const input = postEl.querySelector('.comment-editor input');
      sendComment(postEl, p, input);
    }
  });

  postsEl.addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.matches('.comment-editor input')){
      const postEl = e.target.closest('.post');
      const p = currentPosts.find(x => String(x.id) === String(postEl.dataset.id));
      if(p) sendComment(postEl, p, e.target);
    }
  });

  refresh();
  return { refresh: refresh };
}
