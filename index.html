/* ================= My World（爱好） ================= */
const DEFAULT_HOBBIES = [
  { id: 'h-photo',  name: '摄影', icon: '📷' },
  { id: 'h-music',  name: '音乐', icon: '🎵' },
  { id: 'h-travel', name: '旅行', icon: '✈️' }
];
let hobbies = null;
let activeHobbyId = null;

const hobbyTabsEl = $('#hobby-tabs');
const hobbyFeedEl = $('#hobby-feed');

function renderWorld(){
  hobbyTabsEl.innerHTML = hobbies.length
    ? hobbies.map(h =>
        '<button class="hobby-chip' + (h.id === activeHobbyId ? ' active' : '') + '" data-id="' + h.id + '">' +
          '<span>' + h.icon + '</span>' + escapeHTML(h.name) +
          '<i class="chip-x admin-only" data-x="' + h.id + '" title="删除爱好">×</i>' +
        '</button>'
      ).join('')
    : '<span class="no-hobby-hint">还没有爱好</span>';

  const h = hobbies.find(x => x.id === activeHobbyId);
  if(!h){
    hobbyFeedEl.innerHTML = '<div class="empty card"><div class="empty-emoji">🎈</div><p>' +
      (isAdmin ? '点击右上角的「+」添加第一个爱好吧！' : '这里还没有内容，敬请期待 ✨') + '</p></div>';
    return;
  }
  createFeed(hobbyFeedEl, 'hobby_' + h.id, {
    bannerHTML:
      '<div class="feed-banner hobby-banner">' +
        '<div class="hb-icon">' + h.icon + '</div>' +
        '<div><div class="hb-name">' + escapeHTML(h.name) + '</div>' +
        '<div class="hb-sub">关于「' + escapeHTML(h.name) + '」的点点滴滴</div></div>' +
      '</div>',
    emptyText: '还没有关于「' + h.name + '」的记录，来发第一条吧 ✨'
  });
}

function openHobby(id){
  activeHobbyId = id;
  store.set('mirror_active_hobby', id);
  renderWorld();
}

async function deleteHobby(id){
  if(!isAdmin) return;
  const h = hobbies.find(x => x.id === id);
  if(!h) return;
  const ok = await confirmDialog('确定删除爱好「' + escapeHTML(h.name) + '」吗？<br><small>这个爱好下的所有记录也会一起删除哦</small>');
  if(!ok) return;
  if(CLOUD_ON){
    await sb.from('posts').delete().eq('feed', 'hobby_' + id);
  }else{
    const orphanPosts = store.get('mirror_posts_hobby_' + id, []);
    orphanPosts.forEach(p => { if(p.tracks) p.tracks.forEach(t => { if(t.mid) idb.del(t.mid); }); });
    store.del('mirror_posts_hobby_' + id);
  }
  hobbies = hobbies.filter(x => x.id !== id);
  settingsSave('mirror_hobbies', hobbies);
  if(activeHobbyId === id) activeHobbyId = hobbies.length ? hobbies[0].id : null;
  store.set('mirror_active_hobby', activeHobbyId);
  renderWorld();
  toast('已删除爱好');
}

hobbyTabsEl.addEventListener('click', e => {
  const x = e.target.closest('.chip-x');
  if(x){
    if(!isAdmin) return;
    e.stopPropagation();
    deleteHobby(x.dataset.x);
    return;
  }
  const chip = e.target.closest('.hobby-chip');
  if(chip) openHobby(chip.dataset.id);
});

const EMOJI_CHOICES = ['📷','🎵','✈️','🎮','📚','🍜','🎨','🏃','🐱','🌱','🎬','⚽'];
function showAddHobby(){
  if(!isAdmin) return;
  openModal(
    '<h3 class="modal-title">添加新爱好 ✨</h3>' +
    '<input id="hobby-name-input" class="modal-input" maxlength="12" placeholder="给爱好起个名字，如：摄影" />' +
    '<div class="emoji-grid">' +
      EMOJI_CHOICES.map((em, i) => '<button class="emoji-opt' + (i === 0 ? ' sel' : '') + '" data-e="' + em + '">' + em + '</button>').join('') +
    '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn-ghost" data-a="cancel">取消</button>' +
      '<button class="btn-primary" data-a="ok">添加</button>' +
    '</div>'
  );
  let icon = EMOJI_CHOICES[0];
  const box = $('#modal-box');
  box.querySelectorAll('.emoji-opt').forEach(b => b.onclick = () => {
    box.querySelectorAll('.emoji-opt').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    icon = b.dataset.e;
  });
  box.querySelector('[data-a=cancel]').onclick = closeModal;
  box.querySelector('[data-a=ok]').onclick = () => {
    const name = $('#hobby-name-input').value.trim();
    if(!name){ toast('给爱好起个名字吧～'); return; }
    if(hobbies.some(h => h.name === name)){ toast('已经有这个爱好啦'); return; }
    const h = { id: 'h' + Date.now(), name: name, icon: icon };
    hobbies.push(h);
    settingsSave('mirror_hobbies', hobbies);
    closeModal();
    openHobby(h.id);
    toast('新爱好已添加 🎉');
  };
  setTimeout(() => { const inp = $('#hobby-name-input'); if(inp) inp.focus(); }, 60);
}
$('#add-hobby-btn').addEventListener('click', showAddHobby);

/* ================= 登录后刷新动态与反馈 ================= */
function refreshCurrentFeeds(){
  if(journalFeed) journalFeed.refresh();
  if($('#mod-world').classList.contains('active')) renderWorld();
  renderFeedbackAdmin();
}

/* ================= 模块切换 ================= */
function switchModule(name){
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.m === name));
  $$('.module').forEach(m => m.classList.toggle('active', m.id === 'mod-' + name));
  if(name === 'journal') initJournal();
  if(name === 'world') renderWorld();
  try{ sessionStorage.setItem('mirror_current_module', name); }catch(e){}
  $('#main').scrollTop = 0;
}
$$('.nav-btn').forEach(b => b.addEventListener('click', () => switchModule(b.dataset.m)));

/* ================= 开场动画 ================= */
const intro = $('#intro'), w1 = $('#w1'), w2 = $('#w2');
let introTimers = [];
function playIntro(){
  introTimers.forEach(clearTimeout);
  introTimers = [];
  intro.classList.remove('gone');
  document.body.classList.add('locked');
  w1.classList.remove('show', 'hide');
  w2.classList.remove('show', 'hide');
  void w1.offsetWidth;
  const t = (fn, ms) => introTimers.push(setTimeout(fn, ms));
  t(() => w1.classList.add('show'), 400);
  t(() => { w1.classList.remove('show'); w1.classList.add('hide'); }, 2150);
  t(() => w2.classList.add('show'), 2750);
  t(() => { w2.classList.remove('show'); w2.classList.add('hide'); }, 4850);
  t(endIntro, 5500);
}
function endIntro(){
  introTimers.forEach(clearTimeout);
  introTimers = [];
  intro.classList.add('gone');
  document.body.classList.remove('locked');
  $('#app').classList.add('ready');
  maybeAskVisitorName();
}
intro.addEventListener('click', endIntro);
$('#replay-intro').addEventListener('click', playIntro);
$('#visitor-card').addEventListener('click', async () => {
  await showVisitorRegister(true);
  refreshCurrentFeeds();
});

/* ================= AI Mirror 聊天 ================= */
const AI_FN_NAME = 'mirror-chat';
let aiHistory = store.get('mirror_ai_history', []);
if(!Array.isArray(aiHistory)) aiHistory = [];

/* ---- Turnstile 人机验证（防机器人刷 AI 烧钱） ---- */
let turnstileToken = '';        /* 当前验证拿到的临时票据（用一次就作废） */
let turnstileWidget = null;     /* 已渲染的验证组件 id */
let turnstileApiReady = false;  /* Cloudflare 的 js 是否加载完成 */
window.onloadTurnstile = function(){
  turnstileApiReady = true;
  mountTurnstile();
};
function mountTurnstile(){
  const slot = $('#ai-turnstile');
  if(!slot) return;
  /* 需要验证的条件：云模式 + 配了 sitekey + 不是站长；站长登录后免验证 */
  const need = CLOUD_ON && !!CLOUD_CONFIG.TURNSTILE_SITEKEY && !isAdmin;
  if(need && turnstileApiReady && typeof turnstile !== 'undefined'){
    slot.hidden = false;
    if(turnstileWidget === null){
      turnstileWidget = turnstile.render(slot, {
        sitekey: CLOUD_CONFIG.TURNSTILE_SITEKEY,
        callback: t => { turnstileToken = t; },
        'expired-callback': () => { turnstileToken = ''; },
        'error-callback': () => { turnstileToken = ''; }
      });
    }
  }else{
    slot.hidden = true;
  }
}

function aiMsgHTML(m){
  const who = m.role === 'user' ? 'user' : 'ai';
  const avatar = m.role === 'user' ? avatarHTML(visitorProfile().avatar) : '🪞';
  const cls = m.error ? ' error' : (m.pending ? ' thinking' : '');
  return '<div class="ai-msg ' + who + cls + '">' +
    '<span class="m-avatar">' + avatar + '</span>' +
    '<span class="m-bubble">' + escapeHTML(m.content) + '</span>' +
  '</div>';
}
function renderAiChat(){
  const box = $('#ai-msgs');
  if(!box) return;
  let html = '';
  if(!aiHistory.length){
    const vn = visitorProfile().name;
    html += aiMsgHTML({ role: 'assistant', content: '嗨' + (vn ? '，' + vn : '') + '！我是站长的 AI 分身 🪞 想了解站长的事，或者随便聊聊别的，都可以～' });
  }
  html += aiHistory.map(aiMsgHTML).join('');
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}
async function sendAi(){
  const input = $('#ai-input');
  const v = input.value.trim();
  if(!v) return;
  if(!CLOUD_ON){ toast('AI 功能需要云端模式（部署上线后可用）'); return; }

  /* 站长凭证：登录后带上传给中转站，验证通过则不限额、免人机验证 */
  let adminToken = '';
  try{
    const sess = await sb.auth.getSession();
    adminToken = (sess && sess.data && sess.data.session && sess.data.session.access_token) || '';
  }catch(e){}

  /* 普通访客：配了人机验证就必须先拿到验证票据（不清空输入，允许稍后重发） */
  if(!adminToken && CLOUD_CONFIG.TURNSTILE_SITEKEY && !turnstileToken){
    toast('人机验证还在加载，请稍等一秒再发 ⏳');
    return;
  }

  input.value = '';
  const btn = $('#ai-send');
  btn.disabled = true;
  aiHistory.push({ role: 'user', content: v });
  aiHistory.push({ role: 'assistant', content: '思考中…', pending: true });
  renderAiChat();
  try{
    const sendMsgs = aiHistory.filter(m => !m.pending && !m.error).slice(-16);
    const { data, error } = await sb.functions.invoke(AI_FN_NAME, {
      body: {
        messages: sendMsgs,
        vid: visitorProfile().id,
        adminToken: adminToken,
        turnstileToken: turnstileToken
      }
    });
    aiHistory.pop(); /* 去掉"思考中" */
    if(error || !data || typeof data.reply !== 'string'){
      let tip = 'AI 暂时走神了，稍后再试';
      if(data && data.error === 'no-key') tip = '站长还没配置 AI 钥匙 🔑';
      if(data && data.error === 'quota') tip = '今天的聊天额度用完啦，明天再来找我玩～';
      if(data && data.error === 'bad-captcha') tip = '人机验证没通过，刷新页面再试一次';
      aiHistory.push({ role: 'assistant', content: '⚠️ ' + tip, error: true });
    }else{
      aiHistory.push({ role: 'assistant', content: data.reply });
    }
  }catch(e){
    aiHistory.pop();
    aiHistory.push({ role: 'assistant', content: '⚠️ 网络好像不太好，稍后再试', error: true });
  }
  /* Turnstile 票据用一次就作废，立刻重置换一张新的 */
  if(turnstileWidget !== null && typeof turnstile !== 'undefined'){
    try{ turnstile.reset(turnstileWidget); }catch(e){}
  }
  turnstileToken = '';
  aiHistory = aiHistory.slice(-30);
  store.set('mirror_ai_history', aiHistory);
  renderAiChat();
  btn.disabled = false;
  input.focus();
}
$('#ai-send').addEventListener('click', sendAi);
$('#ai-input').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendAi(); }
});
renderAiChat();
mountTurnstile(); /* 兜底：Turnstile 的 js 可能比我们加载得早 */

/* ================= 启动 ================= */
function loadSettings(){
  profile = store.get('mirror_profile', null);
  if(!profile || typeof profile.nickname !== 'string' || !profile.nickname){
    profile = { nickname: DEFAULT_PROFILE.nickname, avatar: null };
    store.set('mirror_profile', profile);
  }
  tags = store.get('mirror_tags', null);
  if(!Array.isArray(tags)) tags = DEFAULT_TAGS.slice();
  infoCards = store.get('mirror_info_cards', null);
  if(!Array.isArray(infoCards)) infoCards = DEFAULT_INFO.slice();
  introText = store.get('mirror_intro_text', null);
  if(typeof introText !== 'string') introText = DEFAULT_INTRO;
  contacts = store.get('mirror_contacts', null);
  if(!Array.isArray(contacts)) contacts = DEFAULT_CONTACTS.slice();
  hobbies = store.get('mirror_hobbies', null);
  if(!Array.isArray(hobbies)) hobbies = DEFAULT_HOBBIES.slice();
  activeHobbyId = store.get('mirror_active_hobby', hobbies.length ? hobbies[0].id : null);
  if(!hobbies.some(h => h.id === activeHobbyId)) activeHobbyId = hobbies.length ? hobbies[0].id : null;
}

(async function boot(){
  if(CLOUD_ON){
    try{ await syncSettingsFromCloud(); }catch(e){ /* 离线时用本地缓存 */ }
  }
  loadSettings();
  seedJournal();
  renderTags();
  renderInfoCards();
  renderIntro();
  renderContacts();
  renderProfile();
  renderFeedbackAdmin();
  renderVisitorCard();
  await initAuth();
  /* 同一会话内：刷新保持当前模块、不重放动画；
     关闭标签页/浏览器后重开：回到 About Me 并重新播放开场动画 */
  try{ localStorage.removeItem('mirror_current_module'); localStorage.removeItem('mirror_intro_seen'); }catch(e){}
  const validModules = ['about', 'world', 'journal', 'ai'];
  let lastModule = 'about';
  try{ lastModule = sessionStorage.getItem('mirror_current_module') || 'about'; }catch(e){}
  switchModule(validModules.indexOf(lastModule) > -1 ? lastModule : 'about');
  renderProfile();
  $('#about-avatar').addEventListener('click', showProfileEdit);
  let introSeen = false;
  try{ introSeen = sessionStorage.getItem('mirror_intro_seen') === '1'; }catch(e){}
  if(introSeen){
    endIntro();
  }else{
    try{ sessionStorage.setItem('mirror_intro_seen', '1'); }catch(e){}
    playIntro();
  }
})();
</script>
